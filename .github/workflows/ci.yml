name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines says >=22; tests run TypeScript directly via type stripping,
        # so both the floor and the current LTS have to work.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # No cache option: package-lock.json is gitignored, so there is no lock
          # file to key a cache on.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
