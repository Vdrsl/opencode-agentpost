# Dependabot version updates. The only ecosystem here is npm: the manifest and
# its lockfile live at the repo root, and the repo has no GitHub Actions
# workflows yet. Add a "github-actions" entry when it does.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # @opencode-ai/plugin, typescript, @types/node
    directory: "/" # package.json + package-lock.json
    schedule:
      interval: "weekly"
